name: Package validation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Validate package shape
        shell: bash
        run: |
          set -euo pipefail
          test -f README.md
          test -f README.en.md
          test -f SKILL.md
          test -f LICENSE
          test -f CHANGELOG.md
          test -f CONTRIBUTING.md
          test -f agents/openai.yaml
          test -f references/check-matrix.md
          test -f references/score-rubric.json
          test -f references/scorecard-schema.json
          test -f references/market-positioning.md
          test -f references/demo-storyboard.md
          test -f references/profiles/content-agent.json
          test -f harness_score.py
          test -f tests/test_harness_score.py
          test -f assets/harness-check-flow.svg
          test -f website/index.html
          test -f website/assets/site.css
          test -f website/assets/app.js
          test -f website/guide/index.html
          test -f website/guide/assets/guide.css
          test -f website/guide/assets/guide.js
          test -f website/data/demo-scorecard.json
          test -f website/assets/fonts/GoogleSans-Finance-Latin.woff2
          test -f website/assets/fonts/GoogleSansText-Regular.ttf
          test -f website/assets/fonts/GoogleSansText-Medium.ttf
          test -f website/assets/fonts/GoogleSansFlex-Regular.ttf
          test -f website/assets/fonts/NotoSansSC-Variable-FULL.woff2
          grep -q '^name: hekouwang-harness-check-skill$' SKILL.md
          grep -q 'working-tree' SKILL.md
          grep -q 'staged' SKILL.md
          grep -q 'ci' SKILL.md
          grep -q 'hekouwang-harness-check-skill' README.en.md
          python3 -c 'import xml.etree.ElementTree as ET; ET.parse("assets/harness-check-flow.svg")'
          python3 -c 'import json; json.load(open("references/score-rubric.json")); json.load(open("references/scorecard-schema.json"))'
          python3 -c 'import json; json.load(open("website/data/demo-scorecard.json"))'
          python3 -c 'from html.parser import HTMLParser; HTMLParser().feed(open("website/index.html").read())'
          node --check website/assets/app.js
          node --check website/guide/assets/guide.js
          python3 - <<'PY'
          from pathlib import Path

          site = Path("website/assets/site.css").read_text()
          guide = Path("website/guide/assets/guide.css").read_text()
          assert ".scan-lines .scan-check, .scan-lines .scan-partial" in site
          assert ".partial" not in site
          assert "font-weight:500 700" not in guide
          assert "font-weight:400 900" not in guide
          assert '--display:"Google Sans","Google Sans Flex"' in guide
          print("web typography and scorecard layout guard: ok")
          PY

      - name: Test Harness Scorecard
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/test_harness_score.py

      - name: Check Markdown links and whitespace
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          if grep -RInE '(^|[[:space:]])(file://|/Users/|/private/|/tmp/)' \
            README.md README.en.md SKILL.md CONTRIBUTING.md references; then
            echo 'Found machine-local path'
            exit 1
          fi
