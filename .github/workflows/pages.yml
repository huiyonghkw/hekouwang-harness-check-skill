name: Deploy product page

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate static product page
        run: |
          test -s website/index.html
          test -s website/assets/site.css
          test -s website/assets/app.js
          test -s website/assets/harness-doctor-run.gif
          test -s website/assets/harness-check-flow.svg
          test -s website/guide/index.html
          test -s website/guide/assets/guide.css
          test -s website/guide/assets/guide.js
          test -s website/data/demo-scorecard.json
          node --check website/assets/app.js
          node --check website/guide/assets/guide.js
          python3 - <<'PY'
          import json
          from html.parser import HTMLParser
          from pathlib import Path

          json.loads(Path("website/data/demo-scorecard.json").read_text())

          class PageParser(HTMLParser):
              pass

          PageParser().feed(Path("website/index.html").read_text())
          print("static product page: ok")
          PY
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: website

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
