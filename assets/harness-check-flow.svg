<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc">
  <title id="title">Harness 检查器 Skill 流程图</title>
  <desc id="desc">从用户请求开始，选择验证模式，调用唯一 verify.sh 入口，运行检查层，生成自动化报告，补充宿主烟测和人工验收，最后给出交付判定。</desc>
  <defs>
    <linearGradient id="header" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14283f"/>
      <stop offset="1" stop-color="#1d4f63"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e4f8f3"/>
      <stop offset="1" stop-color="#cceee5"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff5df"/>
      <stop offset="1" stop-color="#f8e4b5"/>
    </linearGradient>
    <linearGradient id="rose" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff0ef"/>
      <stop offset="1" stop-color="#f5d2cf"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#132b3d" flood-opacity=".12"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#6f8996"/>
    </marker>
    <marker id="arrow-teal" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#159b85"/>
    </marker>
    <style>
      .font { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", Arial, sans-serif; }
      .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace; }
      .title { fill: #ffffff; font-size: 34px; font-weight: 800; letter-spacing: .02em; }
      .subtitle { fill: #b9d8df; font-size: 16px; font-weight: 500; }
      .card-title { fill: #173043; font-size: 21px; font-weight: 800; }
      .card-copy { fill: #4e6673; font-size: 16px; font-weight: 500; }
      .small { fill: #718894; font-size: 13px; font-weight: 600; }
      .small-light { fill: #d9edf0; font-size: 13px; font-weight: 600; }
      .mode { fill: #214d5c; font-size: 16px; font-weight: 800; }
      .suite { fill: #244657; font-size: 17px; font-weight: 800; }
      .suite-copy { fill: #5e7782; font-size: 14px; font-weight: 500; }
      .pill { fill: #ffffff; stroke: #c6d9dc; stroke-width: 1; }
      .pill-text { fill: #3e6570; font-size: 13px; font-weight: 700; }
    </style>
  </defs>

  <rect width="1600" height="980" fill="#f7fafb"/>
  <rect x="48" y="38" width="1504" height="108" rx="24" fill="url(#header)" filter="url(#shadow)"/>
  <text x="88" y="86" class="font title">Harness Check Skill</text>
  <text x="88" y="117" class="font subtitle">证据驱动的检查编排：运行什么、证明什么、还缺什么</text>
  <text x="1468" y="95" text-anchor="end" class="mono small-light">WORKING-TREE · STAGED · CI</text>

  <g filter="url(#shadow)">
    <rect x="48" y="190" width="292" height="126" rx="20" fill="#ffffff" stroke="#d7e3e6"/>
    <rect x="370" y="190" width="292" height="126" rx="20" fill="#ffffff" stroke="#d7e3e6"/>
    <rect x="692" y="190" width="292" height="126" rx="20" fill="url(#amber)" stroke="#edd49b"/>
    <rect x="1014" y="190" width="538" height="126" rx="20" fill="url(#teal)" stroke="#a7dccc"/>
  </g>
  <text x="76" y="225" class="font small">01 · REQUEST</text>
  <text x="76" y="257" class="font card-title">用户请求检查</text>
  <text x="76" y="284" class="font card-copy">体检 · 回归 · 验收 · 诊断</text>
  <text x="398" y="225" class="font small">02 · ROOT</text>
  <text x="398" y="257" class="font card-title">定位 Harness 真源</text>
  <text x="398" y="284" class="mono card-copy">.harness/scripts/verify.sh</text>
  <text x="720" y="225" class="font small">03 · MODE</text>
  <text x="720" y="257" class="font card-title">选择验证模式</text>
  <text x="720" y="284" class="font mode">本地 · 暂存区 · CI</text>
  <text x="1042" y="225" class="font small">04 · CANONICAL ENTRY</text>
  <text x="1042" y="257" class="font card-title">唯一入口：verify.sh</text>
  <text x="1042" y="284" class="font card-copy">直接执行，保留退出码、stderr 和完整检查标签</text>

  <path d="M340 253 H360" stroke="#6f8996" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <path d="M662 253 H682" stroke="#6f8996" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <path d="M984 253 H1004" stroke="#6f8996" stroke-width="3" fill="none" marker-end="url(#arrow)"/>

  <text x="48" y="364" class="font small">05 · CHECK LAYERS</text>
  <path d="M1283 316 V350 H215 V392" stroke="#6f8996" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M1283 316 V350 H602 V392" stroke="#6f8996" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M1283 316 V350 H989 V392" stroke="#6f8996" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M1283 316 V350 H1376 V392" stroke="#6f8996" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="48" y="392" width="334" height="164" rx="20" fill="#ffffff" stroke="#d7e3e6"/>
    <rect x="404" y="392" width="334" height="164" rx="20" fill="#ffffff" stroke="#d7e3e6"/>
    <rect x="760" y="392" width="334" height="164" rx="20" fill="#ffffff" stroke="#d7e3e6"/>
    <rect x="1116" y="392" width="436" height="164" rx="20" fill="#ffffff" stroke="#d7e3e6"/>
  </g>
  <text x="76" y="430" class="font suite">结构与文档</text>
  <text x="76" y="459" class="font suite-copy">规则真源 · Skill · Profile</text>
  <text x="76" y="482" class="font suite-copy">Hook 配置 · 文档链接 · 生成物</text>
  <rect x="76" y="508" width="126" height="27" rx="14" class="pill"/>
  <text x="139" y="527" text-anchor="middle" class="font pill-text">可解析可追踪</text>

  <text x="432" y="430" class="font suite">治理与证据</text>
  <text x="432" y="459" class="font suite-copy">Runtime Governance · Contract</text>
  <text x="432" y="482" class="font suite-copy">SHA-256 · Evaluator · 失败反例</text>
  <rect x="432" y="508" width="126" height="27" rx="14" class="pill"/>
  <text x="495" y="527" text-anchor="middle" class="font pill-text">不接受自报完成</text>

  <text x="788" y="430" class="font suite">安全与状态</text>
  <text x="788" y="459" class="font suite-copy">Safety Gate · Episode</text>
  <text x="788" y="482" class="font suite-copy">allow / ask / deny · 状态链</text>
  <rect x="788" y="508" width="126" height="27" rx="14" class="pill"/>
  <text x="851" y="527" text-anchor="middle" class="font pill-text">失败保持可见</text>

  <text x="1144" y="430" class="font suite">宿主与观测</text>
  <text x="1144" y="459" class="font suite-copy">四端适配 · 脱敏事件 · 趋势</text>
  <text x="1144" y="482" class="font suite-copy">本地 Memory · CI fixture · 链接校验</text>
  <rect x="1144" y="508" width="126" height="27" rx="14" class="pill"/>
  <text x="1207" y="527" text-anchor="middle" class="font pill-text">不夸大覆盖范围</text>

  <path d="M215 556 V598 H388 V634" stroke="#6f8996" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M571 556 V598 H571 V634" stroke="#6f8996" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M927 556 V598 H754 V634" stroke="#6f8996" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M1334 556 V598 H754 V634" stroke="#6f8996" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="48" y="634" width="646" height="184" rx="20" fill="url(#teal)" stroke="#a7dccc"/>
    <rect x="716" y="634" width="394" height="184" rx="20" fill="url(#amber)" stroke="#edd49b"/>
    <rect x="1132" y="634" width="420" height="184" rx="20" fill="#ffffff" stroke="#d7e3e6"/>
  </g>
  <text x="78" y="674" class="font small">06 · AUTOMATED EVIDENCE</text>
  <text x="78" y="708" class="font card-title">自动化报告</text>
  <text x="78" y="738" class="font card-copy">退出码 · 通过项 · 失败项 · 警告 · 原始复现命令</text>
  <text x="78" y="766" class="font card-copy">Runtime Governance 数量只从实际日志读取</text>
  <rect x="78" y="782" width="128" height="27" rx="14" class="pill"/>
  <text x="142" y="801" text-anchor="middle" class="font pill-text">自动化证据</text>

  <text x="746" y="674" class="font small">07 · HUMAN BOUNDARY</text>
  <text x="746" y="708" class="font card-title">宿主烟测与人工验收</text>
  <text x="746" y="738" class="font card-copy">Hook 真实触发 · 视觉 · 事实 · MCP</text>
  <text x="746" y="766" class="font card-copy">不能用 headless 结果代替</text>
  <rect x="746" y="782" width="128" height="27" rx="14" class="pill"/>
  <text x="810" y="801" text-anchor="middle" class="font pill-text">人工证据</text>

  <text x="1162" y="674" class="font small">08 · DECISION</text>
  <text x="1162" y="708" class="font card-title">交付判定</text>
  <text x="1162" y="742" class="font card-copy">自动化失败 → 定位并重跑</text>
  <text x="1162" y="768" class="font card-copy">自动化通过 + 人工待补 → 不宣称完成</text>
  <text x="1162" y="794" class="font card-copy">两者齐备 → 可交付</text>

  <path d="M694 726 H706" stroke="#159b85" stroke-width="3" fill="none" marker-end="url(#arrow-teal)"/>
  <path d="M1110 726 H1122" stroke="#159b85" stroke-width="3" fill="none" marker-end="url(#arrow-teal)"/>
  <path d="M1132 838 C1000 900 650 900 330 838 C210 814 128 784 128 738" stroke="#d07b72" stroke-width="2" stroke-dasharray="8 8" fill="none" marker-end="url(#arrow)"/>
  <text x="510" y="925" class="font small">失败不是静默终点：保留证据 → 指向单项测试 → 修复后重新执行完整入口</text>

  <line x1="48" y1="946" x2="1552" y2="946" stroke="#d6e2e5" stroke-width="1"/>
  <circle cx="76" cy="964" r="7" fill="#159b85"/>
  <text x="92" y="969" class="font small">自动化证据</text>
  <circle cx="220" cy="964" r="7" fill="#e0a83e"/>
  <text x="236" y="969" class="font small">人工 / 宿主证据</text>
  <circle cx="394" cy="964" r="7" fill="#d07b72"/>
  <text x="410" y="969" class="font small">失败 / 待补</text>
  <text x="1522" y="969" text-anchor="end" class="mono small">hekouwang-harness-check-skill</text>
</svg>
