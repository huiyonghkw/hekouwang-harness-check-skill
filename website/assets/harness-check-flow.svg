<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1460" viewBox="0 0 1200 1460" role="img" aria-labelledby="title desc">
  <title id="title">Harness Check 标准时序图</title>
  <desc id="desc">以时间向下的标准时序图：用户和 Agent 发起检查，Harness Check 调用 verify.sh，执行检查层并分别收集自动化证据与人工边界，最后给出交付判定。</desc>
  <defs>
    <radialGradient id="blue" cx="4%" cy="2%" r="70%"><stop offset="0" stop-color="#a8c9ff" stop-opacity=".48"/><stop offset=".72" stop-color="#eef1f8" stop-opacity="0"/></radialGradient>
    <radialGradient id="iris" cx="97%" cy="20%" r="68%"><stop offset="0" stop-color="#dfc8ff" stop-opacity=".45"/><stop offset=".72" stop-color="#eef1f8" stop-opacity="0"/></radialGradient>
    <radialGradient id="mint" cx="10%" cy="94%" r="65%"><stop offset="0" stop-color="#c1f1df" stop-opacity=".38"/><stop offset=".72" stop-color="#eef1f8" stop-opacity="0"/></radialGradient>
    <radialGradient id="peach" cx="95%" cy="92%" r="65%"><stop offset="0" stop-color="#ffd8c9" stop-opacity=".34"/><stop offset=".72" stop-color="#eef1f8" stop-opacity="0"/></radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#1f2687" flood-opacity=".12"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#52718f"/></marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#007aff"/></marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#ff6259"/></marker>
    <style>
      @font-face{font-family:"Alimama ShuHeiTi";src:url("fonts/AlimamaShuHeiTi-Bold.woff2") format("woff2");font-weight:900}
      @font-face{font-family:"Noto Sans SC";src:url("fonts/NotoSansSC-Variable-FULL.woff2") format("woff2");font-weight:100 900}
      @font-face{font-family:"Google Sans Text";src:url("fonts/GoogleSansText-Regular.ttf") format("truetype");font-weight:400}
      @font-face{font-family:"Google Sans Text";src:url("fonts/GoogleSansText-Medium.ttf") format("truetype");font-weight:500}
      @font-face{font-family:"Google Sans";src:url("fonts/GoogleSans-Finance-Latin.woff2") format("woff2");font-weight:100 900}
      .cover{font:900 40px "Alimama ShuHeiTi","Noto Sans SC",sans-serif;letter-spacing:-.05em;fill:rgba(28,28,30,.92)}
      .copy{font:500 15px "Noto Sans SC",sans-serif;fill:rgba(60,60,67,.72)}
      .small{font:500 12px "Google Sans Text","Noto Sans SC",sans-serif;letter-spacing:.05em;fill:rgba(60,60,67,.52)}
      .eyebrow{font:500 13px "Google Sans Text","Noto Sans SC",sans-serif;letter-spacing:.04em;fill:#007aff}
      .participant{font:800 17px "Noto Sans SC",sans-serif;letter-spacing:-.02em;fill:rgba(28,28,30,.92)}
      .participant-en{font:500 11px "Google Sans Text","Noto Sans SC",sans-serif;letter-spacing:.06em;fill:rgba(60,60,67,.52)}
      .message{font:500 14px "Noto Sans SC",sans-serif;fill:rgba(40,44,54,.82)}
      .message-en{font:500 11px "Google Sans Text","Noto Sans SC",sans-serif;fill:rgba(60,60,67,.48)}
      .note{font:500 12px "Noto Sans SC",sans-serif;fill:rgba(60,60,67,.62)}
      .decision{font:900 25px "Alimama ShuHeiTi","Noto Sans SC",sans-serif;letter-spacing:-.04em;fill:rgba(28,28,30,.92)}
      .danger{font:500 12px "Noto Sans SC",sans-serif;fill:#e45d56}
    </style>
  </defs>

  <rect width="1200" height="1460" rx="30" fill="#eef1f8"/>
  <rect width="1200" height="1460" rx="30" fill="url(#blue)"/><rect width="1200" height="1460" rx="30" fill="url(#iris)"/><rect width="1200" height="1460" rx="30" fill="url(#mint)"/><rect width="1200" height="1460" rx="30" fill="url(#peach)"/>

  <!-- Title -->
  <g filter="url(#shadow)"><rect x="52" y="46" width="1096" height="138" rx="26" fill="rgba(255,255,255,.72)" stroke="rgba(255,255,255,.94)"/></g>
  <path d="M84 84H120" stroke="#007aff" stroke-width="2"/><text x="135" y="89" class="small">HARNESS CHECK · SEQUENCE</text>
  <text x="84" y="136" class="cover">一次检查，谁先做什么，结果怎样回来。</text>
  <text x="84" y="163" class="copy">时间从上往下；每条横线都是一次真实调用或一次明确交接。</text>

  <!-- Participants -->
  <text x="70" y="225" class="eyebrow">参与者 / PARTICIPANTS</text>
  <g filter="url(#shadow)">
    <rect x="52" y="244" width="188" height="82" rx="18" fill="rgba(255,255,255,.72)" stroke="rgba(255,255,255,.92)"/>
    <rect x="282" y="244" width="188" height="82" rx="18" fill="rgba(235,246,255,.77)" stroke="rgba(255,255,255,.92)"/>
    <rect x="512" y="244" width="188" height="82" rx="18" fill="rgba(245,238,255,.77)" stroke="rgba(255,255,255,.92)"/>
    <rect x="742" y="244" width="188" height="82" rx="18" fill="rgba(255,255,255,.65)" stroke="rgba(255,255,255,.88)"/>
    <rect x="972" y="244" width="176" height="82" rx="18" fill="rgba(255,246,222,.77)" stroke="rgba(255,255,255,.92)"/>
  </g>
  <text x="146" y="280" text-anchor="middle" class="participant">用户 / Agent</text><text x="146" y="303" text-anchor="middle" class="participant-en">REQUESTER</text>
  <text x="376" y="280" text-anchor="middle" class="participant">Harness Check</text><text x="376" y="303" text-anchor="middle" class="participant-en">VERIFIER</text>
  <text x="606" y="280" text-anchor="middle" class="participant">verify.sh</text><text x="606" y="303" text-anchor="middle" class="participant-en">CANONICAL ENTRY</text>
  <text x="836" y="280" text-anchor="middle" class="participant">检查层</text><text x="836" y="303" text-anchor="middle" class="participant-en">CHECK SUITE</text>
  <text x="1060" y="280" text-anchor="middle" class="participant">人工 / 交付</text><text x="1060" y="303" text-anchor="middle" class="participant-en">HUMAN BOUNDARY</text>

  <!-- Lifelines -->
  <path d="M146 326V1287M376 326V1287M606 326V1287M836 326V1287M1060 326V1287" fill="none" stroke="rgba(82,113,143,.40)" stroke-width="2" stroke-dasharray="6 8"/>

  <!-- Activation bars -->
  <rect x="365" y="398" width="22" height="712" rx="11" fill="rgba(0,122,255,.16)" stroke="rgba(0,122,255,.30)"/>
  <rect x="595" y="470" width="22" height="425" rx="11" fill="rgba(175,82,222,.15)" stroke="rgba(175,82,222,.30)"/>
  <rect x="825" y="546" width="22" height="260" rx="11" fill="rgba(52,199,89,.15)" stroke="rgba(52,199,89,.30)"/>

  <!-- Messages, time moves downward -->
  <text x="70" y="362" class="small">T01 · 发起</text>
  <path d="M146 378H365" fill="none" stroke="#52718f" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="255" y="369" text-anchor="middle" class="message">我要检查当前 Harness</text>

  <text x="70" y="434" class="small">T02 · 定位与选模式</text>
  <path d="M387 450H595" fill="none" stroke="#007aff" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
  <text x="491" y="441" text-anchor="middle" class="message">找到仓库真源，选择 working-tree / staged / CI</text>

  <text x="70" y="506" class="small">T03 · 调用唯一入口</text>
  <path d="M617 522H825" fill="none" stroke="#007aff" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
  <text x="721" y="513" text-anchor="middle" class="message">执行结构、治理、安全、宿主检查</text>

  <text x="70" y="578" class="small">T04 · 返回原始结果</text>
  <path d="M825 594H617" fill="none" stroke="#52718f" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="721" y="585" text-anchor="middle" class="message">退出码 · stderr · 失败标签 · 可复跑命令</text>

  <text x="70" y="650" class="small">T05 · 汇总自动化证据</text>
  <path d="M595 666H387" fill="none" stroke="#007aff" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
  <text x="491" y="657" text-anchor="middle" class="message">自动化通过 / 失败，保留复现路径</text>

  <text x="70" y="722" class="small">T06 · 独立复查</text>
  <path d="M387 738H825" fill="none" stroke="#007aff" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
  <text x="606" y="729" text-anchor="middle" class="message">Evaluator 按任务合同重新检查</text>

  <text x="70" y="794" class="small">T07 · 复查结论</text>
  <path d="M847 810H387" fill="none" stroke="#52718f" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="617" y="801" text-anchor="middle" class="message">确认遗漏，标出自动化没有覆盖的部分</text>

  <text x="70" y="866" class="small">T08 · 人工边界</text>
  <path d="M387 882H1049" fill="none" stroke="#ff9500" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="718" y="873" text-anchor="middle" class="message">需要真实宿主烟测、视觉或发布验收吗？</text>

  <text x="70" y="938" class="small">T09 · 记录边界</text>
  <path d="M1049 954H387" fill="none" stroke="#52718f" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="718" y="945" text-anchor="middle" class="message">人工证据 / 待补项，不把未做写成通过</text>

  <text x="70" y="1010" class="small">T10 · 给出判定</text>
  <path d="M387 1026H146" fill="none" stroke="#007aff" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
  <text x="266" y="1017" text-anchor="middle" class="message">可交付 / 待补 / 阻断 + 下一步</text>

  <!-- Decision readout -->
  <g filter="url(#shadow)"><rect x="146" y="1068" width="920" height="137" rx="25" fill="rgba(255,255,255,.76)" stroke="rgba(255,255,255,.94)"/></g>
  <text x="182" y="1102" class="small">OUTPUT · HANDOFF DECISION</text>
  <text x="182" y="1147" class="decision">结果不是一句“完成”，而是一份可追问的交接。</text>
  <text x="182" y="1177" class="copy">自动化证据、人工边界和下一步动作分开写清楚。</text>

  <!-- Failure branch -->
  <path d="M387 1232H1049V1108" fill="none" stroke="#ff6259" stroke-width="2.5" stroke-dasharray="8 9" stroke-linecap="round" marker-end="url(#arrow-red)"/>
  <g transform="translate(438 1214)"><rect width="440" height="37" rx="18.5" fill="rgba(255,245,244,.80)" stroke="rgba(255,107,97,.35)"/><text x="220" y="24" text-anchor="middle" class="danger">任一失败：记录根因 → 加控制 → 加反例 → 重跑</text></g>
  <text x="600" y="1340" text-anchor="middle" class="note">标准时序图：上方是参与者，中间是调用，下方是结论与回退。</text>
  <text x="600" y="1380" text-anchor="middle" class="small">Harness Check · evidence before “done”</text>
</svg>
